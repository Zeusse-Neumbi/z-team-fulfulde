name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --project apps/server --frozen --extra dev

      - name: Verify
        run: pnpm ci:local

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build fixture extension
        run: pnpm build:test

      - name: End-to-end tests
        run: pnpm e2e

      - name: Build the technical note
        run: pnpm note:build

      - name: Assemble the form package and checksums
        run: pnpm submission

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/zteam-fulfulde-extension-*.zip \
            dist/Z-Team_Fulfulde_Assistant_Technical_Note_*.pdf \
            submission/SHA256SUMS.txt \
            --title "Z-Team Fulfulde Assistant — preselection $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease
