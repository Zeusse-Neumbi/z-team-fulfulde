name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build submission extension
        run: pnpm build:submission

      - name: Check bundled audio
        run: pnpm audio:check

      - name: Package extension
        run: pnpm package

      - name: Check package size
        run: pnpm size:check

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

      - name: Upload extension package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-${{ github.run_id }}
          path: dist/zteam-fulfulde-extension-*.zip
          if-no-files-found: error
          retention-days: 14

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync --project apps/server --frozen --extra dev

      - name: Ruff lint
        run: uv run --project apps/server ruff check apps/server

      - name: Ruff format check
        run: uv run --project apps/server ruff format --check apps/server

      - name: MyPy
        run: uv run --project apps/server mypy apps/server/app --config-file apps/server/pyproject.toml

      - name: Pytest
        run: uv run --project apps/server pytest

      - name: Audit Python dependencies
        run: |
          uv export --project apps/server --frozen --no-hashes --no-dev --no-emit-workspace --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt"

  e2e:
    name: E2E / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build fixture extension
        run: pnpm build:test

      - name: Run Playwright
        run: pnpm e2e

  submission:
    name: Submission pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the submission draft pack
        run: pnpm build:submission

      - name: Serve the local demo page
        run: |
          node scripts/serve-eval.mjs > "$RUNNER_TEMP/serve-eval.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serve-eval.pid"
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/journey/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/serve-eval.log"
          exit 1

      - name: Check the submission pack on the demo page
        run: pnpm check:draft

      - name: Build the 5-page technical note
        run: pnpm note:build

      - name: Upload submission artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: submission-${{ github.run_id }}
          path: |
            dist/zteam-fulfulde-extension-v*.zip
            dist/Z-Team_Fulfulde_Assistant_Technical_Note_v*.pdf
          retention-days: 14

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.12
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          mkdir -p "$HOME/.local/bin"
          for attempt in 1 2 3 4 5; do
            if curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"; then
              break
            fi
            echo "actionlint download failed (attempt ${attempt}); retrying in 5s..."
            sleep 5
          done
          test -s "$archive"
          tar -xzf "$archive" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          mkdir -p "$HOME/.local/bin"
          for attempt in 1 2 3 4 5; do
            if curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"; then
              break
            fi
            echo "gitleaks download failed (attempt ${attempt}); retrying in 5s..."
            sleep 5
          done
          test -s "$archive"
          tar -xzf "$archive" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose --config .gitleaks.toml

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Audit Python dependencies
        run: |
          uv export --project apps/server --frozen --no-hashes --no-dev --no-emit-workspace --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt"

  repo-guard:
    name: Repository guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test git hooks
        run: sh scripts/tests/test-githooks.sh

      - name: Check repository hygiene
        run: bash scripts/check-repo-hygiene.sh

      - name: Check AI configuration
        run: node scripts/check-ai-config.mjs

  ci-required:
    name: ci-required
    if: always()
    needs:
      - web
      - api
      - e2e
      - submission
      - workflows
      - security
      - repo-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | jq -e 'to_entries[] | select(.value.result != "success")' > /dev/null; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
